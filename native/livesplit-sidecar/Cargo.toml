[package]
name = "gametimespliter-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Native livesplit-core timer engine for Game Time Splitter"

[dependencies]
livesplit-core = { version = "=0.13.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
time = "=0.3.45"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
